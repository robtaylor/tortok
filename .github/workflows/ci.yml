# Checks every pull request and every push to main.
#
# backend: typecheck and the Jest suite. The ingest integration tests need a
# real Postgres (Decision 0016, commitment 2); each test file creates and
# drops its own database on the service container below.
# client: the app's typecheck and its unit tests (the Detox suite runs in e2e.yml).
# scripts: tests for the repo scripts that have them (the smoke check).
# docs: the doc linter (links, decision index, statuses), as CLAUDE.md asks
# before every doc commit.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Production runs Fly Postgres flex 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The production image is node:22-alpine (backend/Dockerfile).
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test -- --ci

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tortok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tortok/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test -- --ci

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install: the tested scripts use only Node's standard library.
      - run: npm run test:scripts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run docs/scripts/doctool.py lint
