# Read-only smoke check of production (scripts/smoke.mjs), on a schedule and
# on demand: /health with a git SHA and Postgres reachable, the feed and TURN
# contract, and every feed item's webseed serving hash-verified pieces. Then
# a staleness check: production must not be missing a backend commit that
# reached main more than a day ago (production once ran a seven-month-old
# image unnoticed). A failed run emails the repository owner. Decision 0016,
# commitment 9; WS4 of docs/plans/environments-staging-production-and-their-checks.md.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.

name: smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke
        run: npm run smoke -- https://appview.tortok.app --sha-file deployed-sha
      - name: Production is not behind main
        if: ${{ !cancelled() }}
        run: |
          # The smoke step has already failed if /health gave no SHA.
          [[ -s deployed-sha ]] || exit 0
          deployed="$(cat deployed-sha)"
          if ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "::error::production runs $deployed, which isn't in this repository"
            exit 1
          fi
          cutoff="$(date -u -d '24 hours ago' +%s)"
          stale="$(git log --format='%ct %h %s' "$deployed..HEAD" -- backend/ | awk -v c="$cutoff" '$1 < c')"
          if [[ -n "$stale" ]]; then
            echo "::error::production ($deployed) is missing backend commits merged over a day ago; run npm run deploy:backend"
            echo "$stale"
            exit 1
          fi
          echo "production ($deployed) is current: $(git log --oneline "$deployed..HEAD" -- backend/ | wc -l) newer backend commit(s), none over a day old"
