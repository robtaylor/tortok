app = "tortok-api"
primary_region = "lhr"
# Graceful shutdown (src/index.ts) handles SIGINT and SIGTERM within 8s.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # The origin seeder runs in this process, so the machine must never idle
  # out (a stopped machine stops seeding). Temporary: once the seeder is
  # extracted into its own deployable (Decision 0005/0008), the API can go
  # back to "stop" and scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
