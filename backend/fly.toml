app = "tortok-api"
primary_region = "lhr"
# Graceful shutdown (src/index.ts) handles SIGINT and SIGTERM within 8s.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]

# Start the new machine alongside the old one and move traffic only once its
# /health checks pass (Postgres reachable included); a broken image never
# serves, and the old machine keeps running.
[deploy]
  strategy = "bluegreen"

[env]
  PORT = "8080"
  # Extra trackers on every feed item (Decision 0022); the code has no
  # production default and refuses to boot without it.
  TRACKER_URLS = "wss://tortok-tracker.fly.dev"
  # atproto ingest backfills these on boot: the dev account that holds the
  # test fixtures (scripts/seed-fixtures.mjs).
  INGEST_SEED_DIDS = "did:plc:teqobv6pqer5nw7roqrgi55v"
  # Origin of the feed's blob URLs (posters, avatars, .torrent files): the
  # AppView's public domain, which Cloudflare proxies and caches. The app
  # sits behind TLS-terminating proxies, so the request itself says http.
  PUBLIC_BASE_URL = "https://appview.tortok.app"

[http_service]
  internal_port = 8080
  force_https = true
  # atproto ingest's Jetstream subscriber runs in this process, so the
  # machine must never idle out: a stopped machine misses events, and a gap
  # longer than Jetstream's replay window is lost for accounts that aren't
  # known (known accounts backfill on boot). Revisit if ingest moves to its
  # own process.
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
