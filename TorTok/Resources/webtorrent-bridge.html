<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTorrent Bridge</title>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@2.5.1/webtorrent.min.js"></script>
</head>
<body>
<script>
// WebTorrent Bridge for iOS
(function() {
    'use strict';

    const client = new WebTorrent();
    const torrents = new Map(); // infoHash -> torrent
    const pendingRequests = new Map(); // requestId -> { resolve, reject }

    // Log to Swift
    function log(message) {
        window.webkit?.messageHandlers?.log?.postMessage(message);
        console.log('[WebTorrent]', message);
    }

    // Send response to Swift
    function sendResponse(requestId, success, data, error) {
        window.webkit?.messageHandlers?.response?.postMessage({
            requestId: requestId,
            success: success,
            data: data,
            error: error
        });
    }

    // Send event to Swift
    function sendEvent(event, data) {
        window.webkit?.messageHandlers?.event?.postMessage({
            event: event,
            data: data
        });
    }

    // Add a torrent by magnet URI
    window.addTorrent = function(requestId, magnetURI) {
        log('Adding torrent: ' + magnetURI.substring(0, 60) + '...');

        try {
            // Check if already added
            const existingTorrent = Array.from(torrents.values()).find(t =>
                magnetURI.includes(t.infoHash)
            );

            if (existingTorrent) {
                log('Torrent already exists: ' + existingTorrent.infoHash);
                sendResponse(requestId, true, {
                    infoHash: existingTorrent.infoHash,
                    name: existingTorrent.name,
                    files: existingTorrent.files.map(f => ({
                        name: f.name,
                        path: f.path,
                        length: f.length
                    }))
                });
                return;
            }

            client.add(magnetURI, {
                announce: [
                    'wss://tortok-tracker.fly.dev',
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.btorrent.xyz',
                    'wss://tracker.webtorrent.dev'
                ]
            }, (torrent) => {
                log('Torrent added: ' + torrent.infoHash);
                torrents.set(torrent.infoHash, torrent);

                // Set up event handlers
                torrent.on('download', (bytes) => {
                    sendEvent('download', {
                        infoHash: torrent.infoHash,
                        bytes: bytes,
                        downloadSpeed: torrent.downloadSpeed,
                        progress: torrent.progress,
                        numPeers: torrent.numPeers
                    });
                });

                torrent.on('upload', (bytes) => {
                    sendEvent('upload', {
                        infoHash: torrent.infoHash,
                        bytes: bytes,
                        uploadSpeed: torrent.uploadSpeed
                    });
                });

                torrent.on('wire', (wire) => {
                    sendEvent('peerConnect', {
                        infoHash: torrent.infoHash,
                        numPeers: torrent.numPeers
                    });
                });

                torrent.on('done', () => {
                    log('Torrent complete: ' + torrent.infoHash);
                    sendEvent('done', { infoHash: torrent.infoHash });
                });

                torrent.on('error', (err) => {
                    log('Torrent error: ' + err.message);
                    sendEvent('error', {
                        infoHash: torrent.infoHash,
                        error: err.message
                    });
                });

                sendResponse(requestId, true, {
                    infoHash: torrent.infoHash,
                    name: torrent.name,
                    files: torrent.files.map(f => ({
                        name: f.name,
                        path: f.path,
                        length: f.length
                    }))
                });
            });
        } catch (err) {
            log('Error adding torrent: ' + err.message);
            sendResponse(requestId, false, null, err.message);
        }
    };

    // Get file data
    window.getFile = function(requestId, infoHash, filePath) {
        log('Getting file: ' + filePath + ' from ' + infoHash);

        const torrent = torrents.get(infoHash);
        if (!torrent) {
            sendResponse(requestId, false, null, 'Torrent not found');
            return;
        }

        const file = torrent.files.find(f => f.path === filePath || f.name === filePath);
        if (!file) {
            sendResponse(requestId, false, null, 'File not found: ' + filePath);
            return;
        }

        // Get file as blob and convert to base64
        file.getBlob((err, blob) => {
            if (err) {
                sendResponse(requestId, false, null, err.message);
                return;
            }

            const reader = new FileReader();
            reader.onload = function() {
                const base64 = reader.result.split(',')[1];
                sendResponse(requestId, true, {
                    filePath: filePath,
                    mimeType: blob.type || 'application/octet-stream',
                    size: blob.size,
                    data: base64
                });
            };
            reader.onerror = function() {
                sendResponse(requestId, false, null, 'Failed to read file');
            };
            reader.readAsDataURL(blob);
        });
    };

    // Get file stream URL (for direct playback)
    window.getStreamURL = function(requestId, infoHash, filePath) {
        const torrent = torrents.get(infoHash);
        if (!torrent) {
            sendResponse(requestId, false, null, 'Torrent not found');
            return;
        }

        const file = torrent.files.find(f => f.path === filePath || f.name === filePath);
        if (!file) {
            sendResponse(requestId, false, null, 'File not found');
            return;
        }

        // Create blob URL for streaming
        file.getBlobURL((err, url) => {
            if (err) {
                sendResponse(requestId, false, null, err.message);
                return;
            }
            sendResponse(requestId, true, { url: url, filePath: filePath });
        });
    };

    // Get torrent stats
    window.getStats = function(requestId, infoHash) {
        const torrent = torrents.get(infoHash);
        if (!torrent) {
            sendResponse(requestId, false, null, 'Torrent not found');
            return;
        }

        sendResponse(requestId, true, {
            infoHash: torrent.infoHash,
            progress: torrent.progress,
            downloadSpeed: torrent.downloadSpeed,
            uploadSpeed: torrent.uploadSpeed,
            numPeers: torrent.numPeers,
            downloaded: torrent.downloaded,
            uploaded: torrent.uploaded,
            ratio: torrent.ratio
        });
    };

    // Remove torrent
    window.removeTorrent = function(requestId, infoHash) {
        const torrent = torrents.get(infoHash);
        if (!torrent) {
            sendResponse(requestId, true, { removed: false });
            return;
        }

        torrent.destroy(() => {
            torrents.delete(infoHash);
            log('Torrent removed: ' + infoHash);
            sendResponse(requestId, true, { removed: true });
        });
    };

    // Signal that bridge is ready
    log('WebTorrent Bridge initialized');
    sendEvent('ready', { version: WebTorrent.VERSION });
})();
</script>
</body>
</html>
