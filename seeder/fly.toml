app = "tortok-seeder"
primary_region = "lhr"

[build]

[env]
  HEALTH_PORT = "8080"
  API_URL = "https://tortok-api.fly.dev"
  TRACKER_URL = "wss://tortok-tracker.fly.dev"
  POLL_INTERVAL_MS = "60000"
  CONTENT_DIR = "/data/content"

[mounts]
  source = "seeder_content"
  destination = "/data/content"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 600

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
