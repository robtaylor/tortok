appId: com.anonymous.tortokexpo
---
# Test: User Login
# Logs in with existing credentials and verifies redirect to feed

- launchApp:
    clearState: true

# Should start on login screen
- assertVisible: "TorTok"

# Fill login form
- tapOn:
    id: "emailTextField"
- inputText: "maestro-test@example.com"

- tapOn:
    id: "passwordTextField"
- inputText: "TestPass123!"

# Submit
- tapOn:
    id: "signInButton"

# Should redirect to feed
- assertVisible:
    text: "Home"
    timeout: 5000
