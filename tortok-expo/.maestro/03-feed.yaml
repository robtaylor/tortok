appId: com.anonymous.tortokexpo
---
# Test: Feed Loading
# Verifies the feed loads and displays video content

- launchApp

# Login first (if not already)
- runFlow:
    when:
      visible: "Sign in to continue"
    file: helpers/login.yaml

# Feed should be loaded — either videos or empty state
- assertVisible:
    text: "Home"
    timeout: 5000

# Check that we're on the feed tab
- assertVisible: "Home"
- assertVisible: "Record"
- assertVisible: "Profile"
