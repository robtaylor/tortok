appId: com.anonymous.tortokexpo
---
# Test: User Registration
# Registers a new user and verifies redirect to feed

- launchApp

# Should start on login screen
- assertVisible: "TorTok"
- assertVisible: "Sign in to continue"

# Navigate to registration
- tapOn:
    id: "signUpButton"

# Fill registration form
- tapOn:
    id: "registerEmailTextField"
- inputText: "maestro-test@example.com"

- tapOn:
    id: "registerUsernameTextField"
- inputText: "maestrotest"

- tapOn:
    id: "registerDisplayNameTextField"
- inputText: "Maestro Test"

- tapOn:
    id: "registerPasswordTextField"
- inputText: "TestPass123!"

- tapOn:
    id: "registerConfirmPasswordTextField"
- inputText: "TestPass123!"

# Submit
- tapOn:
    id: "createAccountButton"

# Should redirect to feed (Home tab visible)
- assertVisible:
    text: "Home"
    timeout: 5000
