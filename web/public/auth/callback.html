<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TorTok — Signing in…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p  { color: #999; font-size: 0.95rem; margin: 0.4rem 0; }
    a  { color: #7eb8f7; }
    #status { margin-top: 1.5rem; font-size: 0.9rem; color: #aaa; }
  </style>
</head>
<body>
  <h1>TorTok</h1>
  <p>Completing sign-in…</p>
  <p id="status"></p>

  <noscript>
    <p>JavaScript is required to complete sign-in. Please enable it and reload.</p>
  </noscript>

  <script type="module">
    // -------------------------------------------------------------------------
    // OAuth callback shim
    //
    // This page receives the PDS redirect:
    //   https://tortok.app/auth/callback?code=…&state=…&iss=…
    //
    // Two cases:
    //
    //   (A) Native app installed — deep-link the params to the Expo app so
    //       it can call oauth.handleCallback(url).
    //
    //   (B) Web build — user came from app.tortok.app (Expo web), no native
    //       app is installed. Load @atproto/oauth-client-browser from CDN
    //       and call handleCallback() here, then redirect back to
    //       app.tortok.app.
    // -------------------------------------------------------------------------

    const status = document.getElementById('status');

    function setStatus(msg) {
      status.textContent = msg;
    }

    // Build the deep-link URL from the current page's query string.
    // Scheme uses a single slash: app.tortok:/auth/callback (not double-slash).
    const params = window.location.search; // "?code=…&state=…&iss=…"
    const deepLink = 'app.tortok:/auth/callback' + params;

    // -------------------------------------------------------------------------
    // Case (A): attempt deep-link to native app.
    // We use a brief timeout: if the app is installed the OS will hand off
    // before the timeout fires; if not, we fall through to the web handler.
    // -------------------------------------------------------------------------

    let nativeLaunched = false;

    function attemptNativeDeepLink() {
      // The iframe trick is more reliable than window.location on iOS: the
      // browser won't navigate away from this page when the scheme isn't
      // registered, and the onbeforeunload / visibilitychange signals let
      // us detect whether the OS handled it.
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deepLink;
      document.body.appendChild(iframe);

      // Fallback: if the page is still visible after 1.2 s, assume no app.
      const fallbackTimer = setTimeout(() => {
        if (!nativeLaunched) {
          handleWebCallback();
        }
      }, 1200);

      // If the app opens, the page loses visibility.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          nativeLaunched = true;
          clearTimeout(fallbackTimer);
          // Page stays loaded in the background; nothing more to do.
          setStatus('Opened in TorTok.');
        }
      }, { once: true });
    }

    // -------------------------------------------------------------------------
    // Case (B): web callback handler using @atproto/oauth-client-browser.
    // Loaded lazily so native-app users never pay the cost of the CDN import.
    // -------------------------------------------------------------------------

    async function handleWebCallback() {
      setStatus('Finishing sign-in for web…');

      try {
        // esm.sh resolves peer deps automatically.
        const { BrowserOAuthClient } = await import(
          'https://esm.sh/@atproto/oauth-client-browser@0.3.0'
        );

        const client = await BrowserOAuthClient.load({
          clientId: 'https://tortok.app/.well-known/oauth-client-metadata.json',
          handleResolver: 'https://bsky.social',
        });

        const result = await client.callback(new URLSearchParams(params.slice(1)));

        if (result) {
          // Session established. Hand back to the SPA.
          setStatus('Signed in. Returning to TorTok…');
          window.location.replace('https://app.tortok.app');
        } else {
          setStatus('Sign-in complete.');
          window.location.replace('https://app.tortok.app');
        }
      } catch (err) {
        console.error('[tortok/auth/callback] web callback failed:', err);
        setStatus('');
        document.body.innerHTML = `
          <h1>TorTok</h1>
          <p>Sign-in could not be completed.</p>
          <p>${escapeHtml(String(err.message ?? err))}</p>
          <p>
            <a href="https://app.tortok.app">Back to TorTok</a>
          </p>
        `;
      }
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // -------------------------------------------------------------------------
    // Entry point: always attempt native first; web callback is the fallback.
    // -------------------------------------------------------------------------
    setStatus('Opening TorTok…');
    attemptNativeDeepLink();
  </script>
</body>
</html>
